<title>PentaWar Craft</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ece7db; --panel:#f6f1e6; --panel2:#efe8d9; --line:#dcd2bd; --line2:#c9bda1;
  --ink:#241f16; --ink2:#4b4436; --muted:#7d745f;
  --brand:#9a6f2a; --brand-ink:#7a5518;
  --g-I:#3a8a4c; --g-II:#356f9e; --g-III:#8850ac; --g-IV:#a9482e; --g-NG:#8a8168;
  --heavy:#a9542a; --light:#3f8a5a; --magic:#7a5bb0; --jewel:#b08a2a;
  --gold:#9a6f2a; --good:#3a8a4c;
  --shadow:0 1px 2px rgba(40,34,20,.06),0 8px 24px rgba(40,34,20,.09);
  --radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14120f; --panel:#1d1a15; --panel2:#231f19; --line:#332d23; --line2:#463d2e;
  --ink:#ece3d0; --ink2:#c3b79c; --muted:#8c8168;
  --brand:#d3ab5c; --brand-ink:#e6c374;
  --g-I:#7cc182; --g-II:#79a6d1; --g-III:#bd90dd; --g-IV:#e08a6a; --g-NG:#a89a78;
  --gold:#d3ab5c; --good:#7cc182;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#14120f; --panel:#1d1a15; --panel2:#231f19; --line:#332d23; --line2:#463d2e;
  --ink:#ece3d0; --ink2:#c3b79c; --muted:#8c8168;
  --brand:#d3ab5c; --brand-ink:#e6c374;
  --g-I:#7cc182; --g-II:#79a6d1; --g-III:#bd90dd; --g-IV:#e08a6a; --g-NG:#a89a78;
  --gold:#d3ab5c; --good:#7cc182;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rajdhani,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.4;
  background-image:radial-gradient(1200px 400px at 50% -180px,rgba(154,111,42,.10),transparent 70%);}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 60px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.crest{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;background:linear-gradient(160deg,var(--brand),var(--brand-ink));color:#fff;font-family:Cinzel;font-weight:700;font-size:20px;box-shadow:var(--shadow)}
.head .ttl{flex:1;min-width:0}
.head h1{font-size:21px;letter-spacing:.5px;color:var(--ink);line-height:1.05}
.head .sub{font-size:12px;color:var(--muted);letter-spacing:.4px;margin-top:2px}
.iconbtn{appearance:none;border:1px solid var(--line2);background:var(--panel);color:var(--ink);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:17px;display:grid;place-items:center;font-family:Cinzel;font-weight:700}
.iconbtn:active{transform:translateY(1px)}
.langbtn{width:auto;padding:0 12px;font-size:13px;letter-spacing:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card>.ch{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card>.ch h2{font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)}
.card>.ch .cnt{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:.5px}
.pad{padding:13px 15px}
.search{width:100%;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;font-size:14px}
.search::placeholder{color:var(--muted)}
.viewbar{display:flex;align-items:center;gap:6px;margin-top:11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--panel2)}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:13px;letter-spacing:.4px;padding:7px 13px;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.tabseg{width:100%;margin-bottom:2px}
.tabseg button{flex:1;padding:9px 13px;font-family:Cinzel;font-weight:700;letter-spacing:1px;font-size:13px;text-transform:uppercase}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:2px 15px 0;font-size:13px;color:var(--muted)}
.crumbs .crumb{cursor:pointer;color:var(--brand-ink);font-weight:600}
:root[data-theme="dark"] .crumbs .crumb,@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .crumbs .crumb{color:var(--brand)}}
.crumbs .sep{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding-top:11px}
.chip{appearance:none;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.4px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);border-radius:20px;padding:7px 13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.list{max-height:64vh;overflow:auto}
.navnode{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.navnode:active{background:var(--panel2)}
.navnode .ni{width:34px;height:34px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:17px}
.navnode .nt{flex:1;font-family:Cinzel;font-weight:600;font-size:15px}
.navnode .nc{font-size:12px;color:var(--muted);letter-spacing:.4px}
.navnode .arr{color:var(--muted);font-size:18px;margin-left:4px}
.pill{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:Cinzel;font-weight:700;font-size:12px;flex:none}
.pill.heavy{background:var(--heavy)} .pill.light{background:var(--light)} .pill.magic{background:var(--magic)} .pill.jewel{background:var(--jewel)}
.gbadge{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;font-family:Cinzel;font-weight:700;font-size:11px;flex:none;background:var(--g-NG)}
.gbadge.gI{background:var(--g-I)} .gbadge.gII{background:var(--g-II)} .gbadge.gIII{background:var(--g-III)} .gbadge.gIV{background:var(--g-IV)}
.grphdr{display:flex;align-items:center;gap:8px;padding:11px 15px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700;background:var(--panel);position:sticky;top:0;z-index:1}
.grphdr::after{content:"";flex:1;height:1px;background:var(--line)}
.grphdr .grpc{color:var(--muted);letter-spacing:.3px;font-size:11px}
.setgrp{display:flex;align-items:center;gap:10px;padding:10px 13px 9px;background:var(--panel);position:sticky;top:0;z-index:1;border-top:1px solid var(--line)}
.setgrp .sgico{width:32px;height:32px;flex:0 0 auto;border-radius:7px;background:var(--panel2);object-fit:cover}
.setgrp .sginfo{flex:1;min-width:0}
.setgrp .sgname{display:flex;align-items:center;gap:6px;font-family:Cinzel;font-weight:700;font-size:14px;color:var(--ink);line-height:1.2}
.setgrp .sgbonus{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.setgrp .sgcount{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.3px}
.setgrp .addset{flex:0 0 auto;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.setgrp .addset:active{background:var(--brand);color:#fff}
.setgrp .setdone{flex:0 0 auto;color:var(--good);font-weight:700;font-size:16px;padding:0 8px}
.row{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.row:active{background:var(--panel2)}
.row .ic{width:38px;height:38px;flex:none;border-radius:8px;background:var(--panel2);object-fit:cover;border:1px solid var(--line)}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-top:1px;display:flex;gap:6px;flex-wrap:wrap}
.row .addbtn{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--brand);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.row .addbtn.inplan{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag{font-size:10px;letter-spacing:.4px;padding:1px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink2)}
/* plan */
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.citem{display:flex;align-items:center;gap:11px;padding:9px 15px;border-bottom:1px solid var(--line)}
.citem .ic{width:34px;height:34px;flex:none;border-radius:8px;background:var(--panel2);object-fit:cover;border:1px solid var(--line)}
.citem .info{flex:1;min-width:0}
.citem .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .meta{font-size:11px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.qty button{appearance:none;border:0;background:var(--panel2);color:var(--ink);width:30px;height:30px;font-size:17px;cursor:pointer;font-weight:700}
.qty b{min-width:30px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.subhd{padding:11px 15px 5px;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.mrow{display:flex;align-items:center;gap:11px;padding:8px 15px;border-bottom:1px solid var(--line)}
.mrow .ic{width:30px;height:30px;flex:none;border-radius:7px;background:var(--panel2);object-fit:cover;border:1px solid var(--line)}
.mrow .mn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--brand-ink)}
:root[data-theme="dark"] .mrow .amt{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .mrow .amt{color:var(--brand)}}
.pinput{width:96px;flex:none;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:7px;padding:5px 8px;font:inherit;font-size:13px;text-align:right}
.mrow .sub{font-size:11px;color:var(--muted);white-space:nowrap}
.costbar{display:flex;align-items:center;gap:8px;padding:12px 15px;border-top:2px solid var(--line2);background:var(--panel2)}
.costbar .cl{font-family:Cinzel;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;color:var(--muted)}
.costbar .ctv{margin-left:auto;font-family:Cinzel;font-weight:700;font-size:19px;color:var(--brand-ink);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .costbar .ctv{color:var(--brand)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .costbar .ctv{color:var(--brand)}}
.tools{display:flex;align-items:center;gap:8px;padding:12px 15px;flex-wrap:wrap}
.btn{appearance:none;font-family:inherit;font-weight:600;font-size:14px;letter-spacing:.4px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:active{transform:translateY(1px)}
.togline{display:flex;align-items:center;gap:9px;padding:11px 15px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--line2);border-radius:24px;transition:.15s;cursor:pointer}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+.slider{background:var(--brand)}
.switch input:checked+.slider::before{transform:translateX(18px)}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:8px 12px;line-height:1.5}
.foot a{color:var(--brand-ink)}
:root[data-theme="dark"] .foot a{color:var(--brand)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="wrap">
  <div class="head">
    <div class="crest">P</div>
    <div class="ttl"><h1 id="appTitle">PentaWar Craft</h1><div class="sub" id="appSub"></div></div>
    <button class="iconbtn langbtn" id="langBtn">RU</button>
    <button class="iconbtn" id="themeBtn">☾</button>
  </div>

  <div class="card">
    <div class="ch"><h2 id="catTitle">Каталог</h2><span class="cnt" id="catCnt"></span></div>
    <div class="pad">
      <div class="viewbar">
        <div class="seg tabseg"><button id="tCraft" class="on">Крафт</button><button id="tUpgrade">Апгрейд</button></div>
      </div>
      <input class="search" id="search" type="text" autocomplete="off">
      <div class="viewbar">
        <div class="seg"><button id="vTree" class="on">Дерево</button><button id="vFilters">Фильтры</button></div>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="chips" id="chips" hidden></div>
    <div class="list" id="list"></div>
  </div>

  <div class="card">
    <div class="ch"><h2 id="planTitle">План крафта</h2><span class="cnt" id="planCnt"></span></div>
    <div id="cart"></div>
    <div id="summary"></div>
    <div class="togline">
      <label class="switch"><input type="checkbox" id="priceToggle"><span class="slider"></span></label>
      <span id="priceLbl">Указать цены на ресурсы</span>
    </div>
    <div class="tools">
      <button class="btn primary" id="copyBtn">Скопировать список</button>
      <button class="btn" id="clearBtn">Очистить</button>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

// ---- catalog helpers ----
var TYPEORDER=["a","j","o"];
var ACORDER=["heavy","light","magic"];
var GRADEORDER=["II","III","IV"];
var SLOTORDER=["FULL_ARMOR","CHEST","LEGS","HEAD","GLOVES","FEET","NECKLACE","LEFT_EAR;RIGHT_EAR","LEFT_FINGER;RIGHT_FINGER","NONE"];
function typeLabel(t){return t==="a"?T("armor"):t==="j"?T("jewelry"):T("other");}
function acLabel(a){return T(a);}
function slotName(s){var o=SLOT[s];return o?L(o):s;}

function statLine(it){
  var p=[]; if(it.st){ if(it.st.pdef)p.push("P.Def "+it.st.pdef); if(it.st.mdef)p.push("M.Def "+it.st.mdef); }
  return p.join(" · ");
}
function rowHtml(it){
  var inplan=state.cart[it.id]>0;
  var meta=[]; if(it.slot&&it.slot!=="NONE")meta.push('<span class="tag">'+esc(slotName(it.slot))+'</span>');
  var sl=statLine(it); if(sl)meta.push(esc(sl));
  meta.push(T("chance")+" "+it.chance+"%");
  return '<div class="row" data-id="'+it.id+'">'+icoImg(it.ic,"ic")+
    '<div class="info"><div class="nm">'+esc(L(it.n))+'</div><div class="meta">'+meta.join("")+'</div></div>'+
    '<button class="addbtn'+(inplan?" inplan":"")+'" data-add="'+it.id+'">'+(inplan?"✓":"+")+'</button></div>';
}
function navNode(kind,val,label,count,left){
  return '<div class="navnode" data-navkind="'+kind+'" data-navval="'+esc(val)+'">'+
    (left||'<span class="ni"></span>')+'<div class="nt">'+esc(label)+'</div>'+
    '<span class="nc">'+count+'</span><span class="arr">›</span></div>';
}
function pool(){
  var arr=ITEMS.filter(function(it){ return state.tab==="upgrade" ? it.up : !it.up; });
  if(state.q){ var q=state.q.toLowerCase(); arr=arr.filter(function(it){return L(it.n).toLowerCase().indexOf(q)>=0 || (it.n.en&&it.n.en.toLowerCase().indexOf(q)>=0);}); }
  return arr;
}

// ---- set-add helpers ----
function setMissingIds(sid){ var s=SETS[sid]; if(!s)return []; return (s.pcs||[]).filter(function(id){return byId[id]&&!(state.cart[id]>0);}); }
function addRestOfSet(sid){
  var ids=setMissingIds(sid);
  if(!ids.length){ toast(T("allIn")); return; }
  ids.forEach(function(id){ state.cart[id]=(state.cart[id]||0)+1; });
  persistCart(); renderCatalog(); renderCart(); renderSummary(); haptic("medium"); toast(T("added")+ids.length);
}
function add(id){ state.cart[id]=(state.cart[id]||0)+1; persistCart(); renderCatalog(); renderCart(); renderSummary(); haptic("light"); }

function crumbLabel(lvl){

  if(state.tab==="upgrade"){ return lvl==="l1"?acLabel(n.l1):(T("gradePfx")+n.l2); }

}
function renderCrumbs(){
  if(state.view!=="tree"||state.q){ crumbsEl.innerHTML=""; return; }

  if(state.nav.l1){ h+='<span class="sep">›</span><span class="crumb" data-crumb="l1">'+esc(crumbLabel("l1"))+'</span>'; }
  if(state.nav.l2){ h+='<span class="sep">›</span><span class="crumb" data-crumb="l2">'+esc(crumbLabel("l2"))+'</span>'; }
  crumbsEl.innerHTML=h;
}
function renderSetLeaf(p3){
  var h="", bySet={}, noset=[];
  p3.forEach(function(it){ if(it.setId&&SETS[it.setId]) (bySet[it.setId]=bySet[it.setId]||[]).push(it); else noset.push(it); });
  var sids=Object.keys(bySet).sort(function(a,b){return L(SETS[a].n)<L(SETS[b].n)?-1:1;});
  function slotSort(a,b){var ia=SLOTORDER.indexOf(a.slot),ib=SLOTORDER.indexOf(b.slot);return (ia<0?99:ia)-(ib<0?99:ib);}
  sids.forEach(function(sid){
    var s=SETS[sid], arr=bySet[sid].sort(slotSort);
    var total=(s.pcs||[]).filter(function(id){return byId[id];}).length;
    var missing=setMissingIds(sid).length, inplan=total-missing;
    h+='<div class="setgrp">'+icoImg(s.ic,"sgico")+
      '<div class="sginfo"><div class="sgname">'+esc(L(s.n))+
      ' <span class="gbadge g'+(s.g||"NG")+'">'+esc(s.g||"")+'</span></div>'+
      (s.bonus&&L(s.bonus)?'<div class="sgbonus">'+esc(L(s.bonus))+'</div>':'')+
      '<div class="sgcount">'+inplan+' / '+total+' '+T("inPlan")+'</div></div>'+
      (missing>0?'<button class="addset" data-set="'+sid+'">'+T("addRest")+' '+missing+'</button>':'<span class="setdone">✓</span>')+
      '</div>';
    arr.forEach(function(it){ h+=rowHtml(it); });
  });
  if(noset.length){
    h+='<div class="grphdr">'+esc(T("noSet"))+'<span class="grpc">'+noset.length+'</span></div>';
    noset.sort(function(a,b){return L(a.n)<L(b.n)?-1:1;}).forEach(function(it){ h+=rowHtml(it); });
  }
  return h;
}
function renderTree(){
  var p=pool(), h="", cnt=0, n=state.nav;

    if(!n.l1){
      ACORDER.forEach(function(a){ var arr=p.filter(function(it){return it.ac===a;}); if(!arr.length)return; cnt+=arr.length;
        h+=navNode("l1",a,acLabel(a),arr.length,'<span class="pill '+a+'">'+acLabel(a).charAt(0)+'</span>'); });
    } else if(!n.l2){
      GRADEORDER.forEach(function(g){ var arr=p.filter(function(it){return it.ac===n.l1&&it.g===g;}); if(!arr.length)return; cnt+=arr.length;
        h+=navNode("l2",g,T("gradePfx")+g,arr.length,'<span class="gbadge g'+g+'">'+g+'</span>'); });
    } else {
      var p3=p.filter(function(it){return it.ac===n.l1&&it.g===n.l2;}); cnt=p3.length; h+=renderSetLeaf(p3);
    }
  } else {
    if(!n.l1){
      TYPEORDER.forEach(function(t){ var arr=p.filter(function(it){return it.t===t;}); if(!arr.length)return; cnt+=arr.length;
        var ic=t==="a"?"🛡":t==="j"?"💍":"⚙";
        h+=navNode("l1",t,typeLabel(t),arr.length,'<span class="ni">'+ic+'</span>'); });
    } else if(n.l1==="a"&&!n.l2){
      ACORDER.forEach(function(a){ var arr=p.filter(function(it){return it.t==="a"&&it.ac===a;}); if(!arr.length)return; cnt+=arr.length;
        h+=navNode("l2",a,acLabel(a),arr.length,'<span class="pill '+a+'">'+acLabel(a).charAt(0)+'</span>'); });
    } else {
      var p3c=p.filter(function(it){ return n.l1==="a"?(it.t==="a"&&it.ac===n.l2):(it.t===n.l1); }); cnt=p3c.length; h+=renderSetLeaf(p3c);
    }

function renderFlat(){
  var p=pool();
  if(state.fclass) p=p.filter(function(it){return it.t==="a"?it.ac===state.fclass:(state.fclass===it.t);});
  p.sort(function(a,b){ var ia=TYPEORDER.indexOf(a.t),ib=TYPEORDER.indexOf(b.t); if(ia!==ib)return ia-ib;
    var sa=a.setId||9999,sb=b.setId||9999; if(sa!==sb)return sa-sb;
    return (SLOTORDER.indexOf(a.slot))-(SLOTORDER.indexOf(b.slot)); });
  var h=""; p.forEach(function(it){ h+=rowHtml(it); });
  listEl.innerHTML=h||'<div class="empty">—</div>';
  document.getElementById("catCnt").textContent=p.length+" "+T("pos");
}
function renderChips(){
  if(state.view!=="filters"){ chipsEl.hidden=true; return; }
  chipsEl.hidden=false;
  var opts=[["heavy",T("heavy")],["light",T("light")],["magic",T("magic")],["j",T("jewelry")],["o",T("other")]];
  var h='<button class="chip'+(state.fclass?"":" on")+'" data-fc="">'+T("armor")+"/"+T("jewelry")+'</button>';
  opts.forEach(function(o){ h+='<button class="chip'+(state.fclass===o[0]?" on":"")+'" data-fc="'+o[0]+'">'+esc(o[1])+'</button>'; });
  chipsEl.innerHTML=h;
}
function renderCatalog(){
  renderCrumbs(); renderChips();
  if(state.q){ renderFlat(); return; }
  if(state.view==="tree") renderTree(); else renderFlat();
}

// ---- render cart + summary ----
function cartEntries(){ return Object.keys(state.cart).filter(function(id){return state.cart[id]>0&&byId[id];}); }
function renderCart(){
  var ids=cartEntries();
  document.getElementById("planCnt").textContent=ids.length?(ids.length+" "+T("pos")):"";
  if(!ids.length){ cartEl.innerHTML='<div class="empty">'+esc(T("empty"))+'</div>'; return; }
  // group by set
  var order=[],seen={};
  ids.forEach(function(id){var it=byId[id];var k=it.setId||("t_"+it.t);if(!seen[k]){seen[k]=[];order.push(k);}seen[k].push(it);});
  var h="";
  order.forEach(function(k){
    var lbl = (String(k).indexOf("t_")===0)? typeLabel(k.slice(2)) : L(SETS[k].n);
    h+='<div class="subhd">'+esc(lbl)+'</div>';
    seen[k].sort(function(a,b){return (SLOTORDER.indexOf(a.slot))-(SLOTORDER.indexOf(b.slot));}).forEach(function(it){
      var q=state.cart[it.id];
      h+='<div class="citem">'+icoImg(it.ic,"ic")+
        '<div class="info"><div class="nm">'+esc(L(it.n))+'</div><div class="meta">'+esc(slotName(it.slot))+'</div></div>'+
        '<div class="qty"><button data-dec="'+it.id+'">−</button><b>'+q+'</b><button data-inc="'+it.id+'">+</button></div></div>';
    });
  });
  cartEl.innerHTML=h;
}
function computeMats(){
  var tot={};
  cartEntries().forEach(function(id){ var it=byId[id],q=state.cart[id];
    (it.d||[]).forEach(function(d){ tot[d[0]]=(tot[d[0]]||0)+d[1]*q; }); });
  return tot;
}
function renderSummary(){
  var ids=cartEntries();
  if(!ids.length){ sumEl.innerHTML=""; return; }
  var tot=computeMats();
  var keys=Object.keys(tot).sort(function(a,b){ return tot[b]-tot[a]; });
  var h='<div class="subhd">'+esc(T("materials"))+'</div>';
  var grand=0;
  keys.forEach(function(mid){
    var m=MATS[mid]||{n:{ru:mid,en:mid}}, amt=tot[mid];
    var price=state.prices[mid]||0, sub=price*amt; grand+=sub;
    h+='<div class="mrow">'+icoImg(m.ic,"ic")+'<span class="mn">'+esc(L(m.n))+'</span>';
    if(state.showPrices){
      h+='<input class="pinput" type="number" min="0" inputmode="numeric" placeholder="'+T("price")+'" data-price="'+mid+'" value="'+(price||"")+'">';
      h+='<span class="amt">×'+fmt(amt)+'</span>';
    } else {
      h+='<span class="amt">'+fmt(amt)+'</span>';
    }
    h+='</div>';
  });
  sumEl.innerHTML=h;
  if(state.showPrices){
    var cb=document.createElement("div"); cb.className="costbar";
    cb.innerHTML='<span class="cl">'+T("total")+'</span><span class="ctv">'+fmt(grand)+' '+T("adena")+'</span>';
    sumEl.appendChild(cb);
  }
}

// ---- copy ----
function copyList(){
  var ids=cartEntries(); if(!ids.length){ toast(T("empty")); return; }
  var lines=[T("craftList"),"",T("craftItems")];
  ids.forEach(function(id){ lines.push("• "+L(byId[id].n)+" ×"+state.cart[id]); });
  lines.push("",T("baseRes")+"");
  var tot=computeMats(), grand=0;
  Object.keys(tot).sort(function(a,b){return tot[b]-tot[a];}).forEach(function(mid){
    var m=MATS[mid]||{n:{ru:mid}}, amt=tot[mid], price=state.prices[mid]||0;
    var line="• "+L(m.n)+": "+fmt(amt); if(state.showPrices&&price){ line+="  ("+fmt(price*amt)+" "+T("adena")+")"; grand+=price*amt; }
    lines.push(line);
  });
  if(state.showPrices&&grand) lines.push("",T("total")+": "+fmt(grand)+" "+T("adena"));
  var txt=lines.join("\n");
  function done(){toast(T("copied"));haptic("light");}
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){fallback(txt);done();}); }
  else { fallback(txt); done(); }
}
function fallback(txt){ var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); }

// ---- events ----
listEl.addEventListener("click",function(e){
  var ab=e.target.closest(".addset"); if(ab){ e.stopPropagation(); addRestOfSet(ab.getAttribute("data-set")); return; }
  var addb=e.target.closest("[data-add]"); if(addb){ e.stopPropagation(); add(addb.getAttribute("data-add")); return; }
  var nn=e.target.closest(".navnode");
  if(nn){ var k=nn.getAttribute("data-navkind"),v=nn.getAttribute("data-navval");
    if(k==="l1") state.nav={l1:v,l2:null}; else if(k==="l2") state.nav.l2=v;
    haptic("light"); renderCatalog(); listEl.scrollTop=0; return; }
  var row=e.target.closest(".row"); if(row){ add(row.getAttribute("data-id")); }
});
crumbsEl.addEventListener("click",function(e){
  var c=e.target.closest(".crumb"); if(!c)return;
  var lvl=c.getAttribute("data-crumb");
  if(lvl==="root") state.nav={l1:null,l2:null}; else if(lvl==="l1") state.nav={l1:state.nav.l1,l2:null};
  renderCatalog();
});
chipsEl.addEventListener("click",function(e){ var c=e.target.closest("[data-fc]"); if(!c)return; state.fclass=c.getAttribute("data-fc")||null; renderCatalog(); });
cartEl.addEventListener("click",function(e){
  var inc=e.target.closest("[data-inc]"),dec=e.target.closest("[data-dec]");
  if(inc){ var i=inc.getAttribute("data-inc"); state.cart[i]=(state.cart[i]||0)+1; }
  else if(dec){ var d=dec.getAttribute("data-dec"); state.cart[d]=(state.cart[d]||0)-1; if(state.cart[d]<=0) delete state.cart[d]; }
  else return;
  persistCart(); renderCart(); renderSummary(); renderCatalog(); haptic("light");
});
sumEl.addEventListener("input",function(e){ var pi=e.target.closest("[data-price]"); if(!pi)return;
  var mid=pi.getAttribute("data-price"), v=parseFloat(pi.value); if(!(v>=0))v=0; state.prices[mid]=v; persistPrices(); updateTotalOnly(); });
function updateTotalOnly(){ var cb=sumEl.querySelector(".costbar .ctv"); if(!cb)return; var tot=computeMats(),g=0;
  Object.keys(tot).forEach(function(m){g+=(state.prices[m]||0)*tot[m];}); cb.textContent=fmt(g)+" "+T("adena"); }

document.getElementById("search").addEventListener("input",function(e){ state.q=e.target.value.trim(); renderCatalog(); });
document.getElementById("vTree").addEventListener("click",function(){ setView("tree"); });
document.getElementById("vFilters").addEventListener("click",function(){ setView("filters"); });
function setView(v){ state.view=v; save("pw_view",v);
  document.getElementById("vTree").classList.toggle("on",v==="tree");
  document.getElementById("vFilters").classList.toggle("on",v==="filters");
  renderCatalog(); }
document.getElementById("tCraft").addEventListener("click",function(){ setTab("craft"); });
document.getElementById("tUpgrade").addEventListener("click",function(){ setTab("upgrade"); });
function setTab(t){ if(state.tab!==t){ state.tab=t; save("pw_tab",t); state.nav={l1:null,l2:null}; state.fclass=null; }
  document.getElementById("tCraft").classList.toggle("on",t==="craft");
  document.getElementById("tUpgrade").classList.toggle("on",t==="upgrade");
  renderCatalog(); listEl.scrollTop=0; }
document.getElementById("priceToggle").addEventListener("change",function(e){ state.showPrices=e.target.checked; save("pw_showprices",state.showPrices); renderSummary(); });
document.getElementById("copyBtn").addEventListener("click",copyList);
document.getElementById("clearBtn").addEventListener("click",function(){ state.cart={}; persistCart(); renderCart(); renderSummary(); renderCatalog(); toast(T("cleared")); });
document.getElementById("langBtn").addEventListener("click",function(){ state.lang=state.lang==="ru"?"en":"ru"; save("pw_lang",state.lang); applyLang(); });
document.getElementById("themeBtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var next=cur==="dark"?"light":(cur==="light"?null:(matchesDark()?"light":"dark"));
  if(next)document.documentElement.setAttribute("data-theme",next); else document.documentElement.removeAttribute("data-theme");
  state.theme=next; save("pw_theme",next); syncThemeBtn();
});
function matchesDark(){return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;}
function syncThemeBtn(){ var d=document.documentElement.getAttribute("data-theme"); var dark=d==="dark"||(!d&&matchesDark());
  document.getElementById("themeBtn").textContent=dark?"☀":"☾"; }

function applyLang(){
  document.getElementById("langBtn").textContent=state.lang==="ru"?"EN":"RU";
  document.getElementById("appTitle").textContent=T("title");
  document.getElementById("appSub").textContent=T("sub");
  document.getElementById("catTitle").textContent=T("cat");
  document.getElementById("planTitle").textContent=T("plan");
  document.getElementById("search").placeholder=T("search");
  document.getElementById("vTree").textContent=T("tree");
  document.getElementById("vFilters").textContent=T("filters");
  document.getElementById("tCraft").textContent=T("tabCraft");
  document.getElementById("tUpgrade").textContent=T("tabUpgrade");
  document.getElementById("priceLbl").textContent=T("priceLbl");
  document.getElementById("copyBtn").textContent=T("copy");
  document.getElementById("clearBtn").textContent=T("clear");
  document.getElementById("foot").innerHTML=T("foot");
  document.title=T("title");
  renderCatalog(); renderCart(); renderSummary();
}

// ---- init ----
if(state.theme)document.documentElement.setAttribute("data-theme",state.theme);
document.getElementById("priceToggle").checked=state.showPrices;
setTab(state.tab); setView(state.view); syncThemeBtn(); applyLang();
try{ if(TG){ TG.ready&&TG.ready(); TG.expand&&TG.expand(); } }catch(e){}
</script>
